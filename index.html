<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Leave Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Header Banner -->
            <div class="card-header">
                <h1>ಕೆ.ಸಿ.ಎಸ್.ಆರ್. ಪ್ರಪತ್ರ-1(ಎ)</h1>
                <div class="subtitle">ಖಾಲಿ ಜಾಗಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ</div>
            </div>

            <!-- Form Content Wrapper -->
            <div class="form-content">
                <form id="ctcForm">
                    
                    <!-- FIELDSET 1: Employee Details (Blue Theme) -->
                    <fieldset class="fieldset-employee">
                        <legend>ನೌಕರರ ಮತ್ತು ಕಚೇರಿ ವಿವರಗಳು (Employee & Office Details)</legend>
                        
                        <div class="form-group">
                            <label for="name">ನೌಕರರ ಹೆಸರು</label>
                            <input type="text" id="name" placeholder="ಹೆಸರನ್ನು ನಮೂದಿಸಿ" required>
                        </div>

                        <div class="form-group">
                            <label for="gerno">GER ಸಂಖ್ಯೆ (ಗೆಜೆಟೆಡ್ ಅಧಿಕಾರಿಯವರು ಮಾತ್ರ)</label>
                            <input type="text" id="gerno" placeholder="ಉದಾ: GER-10123456">
                        </div>

                        <div class="form-group">
                            <label for="designation">ಹುದ್ದೆ</label>
                            <select id="designation" required>
                                <option value="" disabled selected>ಆಯ್ಕೆ ಮಾಡಿ</option>
                                <option value="ಮುಖ್ಯ ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು">ಮುಖ್ಯ ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು</option>
                                <option value="ಹಿರಿಯ ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು">ಹಿರಿಯ ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು</option>
                                <option value="ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು">ಪಶುವೈದ್ದಾಧಿಕಾರಿಗಳು</option>
                                <option value="ಜಾನುವಾರು ಅಭಿವೃದ್ಧಿ ಅಧಿಕಾರಿ">ಜಾನುವಾರು ಅಭಿವೃದ್ಧಿ ಅಧಿಕಾರಿ</option>
                                <option value="ಜಾನುವಾರು ಅಧಿಕಾರಿ">ಜಾನುವಾರು ಅಧಿಕಾರಿ</option>
                                <option value="ಹಿರಿಯ ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು">ಹಿರಿಯ ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು</option>
                                <option value="ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು">ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು</option>
                                <option value="ಕಿರಿಯ ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು">ಕಿರಿಯ ಪಶುವೈದ್ಯಕೀಯ ಪರೀಕ್ಷಕರು</option>
                                <option value="ಡಿ ದರ್ಜೆ ನೌಕರ">ಡಿ ದರ್ಜೆ ನೌಕರ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="institution">ಸಂಸ್ಥೆ</label>
                            <select id="institution" required>
                                <option value="" disabled selected>ಆಯ್ಕೆ ಮಾಡಿ</option>
                                <option value="ಪಶು ಆಸ್ಪತ್ರೆ">ಪಶು ಆಸ್ಪತ್ರೆ</option>
                                <option value="ಪಶು ಚಿಕಿತ್ಸಾಲಯ">ಪಶು ಚಿಕಿತ್ಸಾಲಯ</option>
                                <option value="ಪ್ರಾಥಮಿಕ ಪಶು ಚಿಕಿತ್ಸ ಕೇಂದ್ರ">ಪ್ರಾಥಮಿಕ ಪಶು ಚಿಕಿತ್ಸ ಕೇಂದ್ರ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="place">ಸಂಸ್ಥೆಯ ಸ್ಥಳ</label>
                            <input type="text" id="place" placeholder="ಉದಾ: ಹೊರಳಹಳ್ಳಿ" required>
                        </div>

                        <div class="form-group">
                            <label for="basic">ಮೂಲ ವೇತನ</label>
                            <input type="text" id="basic" placeholder="ಮೂಲ ವೇತನ ನಮೂದಿಸಿ" required>
                        </div>

                        <div class="form-group">
                            <label for="scale">ವೇತನ ಶ್ರೇಣಿ</label>
                            <input type="text" id="scale" placeholder="ವೇತನ ಶ್ರೇಣಿ ನಮೂದಿಸಿ" required>
                        </div>
                    </fieldset>

                    <!-- FIELDSET 2: Leave Details (Green Theme) -->
                    <fieldset class="fieldset-leave">
                        <legend>ರಜೆಯ ವಿವರಗಳು (Leave Details)</legend>

                        <div class="form-group">
                            <label for="typeofleave">ರಜೆಯ ವಿಧಗಳು</label>
                            <select id="typeofleave" required>
                                <option value="" disabled selected>ಆಯ್ಕೆ ಮಾಡಿ</option>
                                <option value="ಗಳಿಕೆ ರಜೆ">ಗಳಿಕೆ ರಜೆ</option>
                                <option value="ಪರಿವರ್ತಿತ ರಜೆ">ಪರಿವರ್ತಿತ ರಜೆ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="from">ರಜೆ ಪ್ರಾರಂಭವಾಗುವ ದಿನಾಂಕ</label>
                            <input type="date" id="from" required>
                        </div>

                        <div class="form-group">
                            <label for="to">ರಜೆಯ ಕೊನೆಯ ದಿನಾಂಕ</label>
                            <input type="date" id="to" required>
                        </div>

                        <div class="form-group">
                            <label for="reason">ಕಾರಣ</label>
                            <select id="reason" required>
                                <option value="" disabled selected>ಆಯ್ಕೆ ಮಾಡಿ</option>
                                <option value="ಗಳಿಕೆ ನಗದೀಕರಣ">ಗಳಿಕೆ ರಜೆ ನಗದೀಕರಣ</option>
                                <option value="ವೈಯಕ್ತಿಕ">ವೈಯಕ್ತಿಕ</option>
                                <option value="ವೈದ್ಯಕೀಯ">ವೈದ್ಯಕೀಯ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="addressonleave">ರಜೆ ಅವಧಿಯ ಸ್ಥಳದ ವಿವರ</label>
                            <input type="text" id="addressonleave" placeholder="ವಿವರಗಳನ್ನು ನಮೂದಿಸಿ" required>
                        </div>
                    </fieldset>

                    <button type="submit" id="generateButton">Generate Leave Form</button>
                </form>

                <!-- Processing States -->
                <div id="waitingMessage" class="waiting hidden">
                    <div class="spinner"></div>
                    <div class="pleaseWait">Please wait…</div>
                    <div id="waitingSeconds">Preparing your leave form PDF</div>
                </div>

                <div id="successMessage" class="success hidden">
                    Leave Form PDF is ready.
                </div>

                <button id="downloadButton" class="download hidden">Download Leave Form PDF</button>
                <div id="errorMessage" class="error hidden"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
